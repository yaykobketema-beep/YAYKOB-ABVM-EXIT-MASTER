name: Build YAYKOB ABVM EXIT MASTER APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Checking project files..."
          ls -la
          test -f package.json || (echo "ERROR: package.json is missing. Upload the actual app project first." && exit 1)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web project
        run: npm run build

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: YAYKOB-ABVM-web-build
          path: dist/
